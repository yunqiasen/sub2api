name: Build Sub2 Fork Docker Image

on:
  push:
    branches:
      - sub2-fork
  workflow_dispatch:
    inputs:
      platforms:
        description: Docker platforms to build
        required: false
        default: linux/amd64,linux/arm64
      push_image:
        description: Push image to GHCR
        required: false
        type: boolean
        default: true

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DEFAULT_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sub2-fork
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repo_lc=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${repo_lc}"
          version=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          short_sha="${GITHUB_SHA::7}"
          created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "short_sha=${short_sha}"
            echo "created=${created}"
            echo 'tags<<TAGS'
            echo "${image}:sub2-fork"
            echo "${image}:${version}-sub2-fork"
            echo "${image}:sha-${short_sha}"
            echo 'TAGS'
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || env.DEFAULT_PLATFORMS }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Sub2API sub2-fork
            org.opencontainers.image.description=Sub2API fork build from sub2-fork branch
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}-sub2-fork
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image tags
        shell: bash
        run: |
          echo "Built image tags:"
          echo '${{ steps.meta.outputs.tags }}'
